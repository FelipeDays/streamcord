<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamCord 1080p • Compartilhamento de Tela Full HD P2P</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS CDN para WebRTC P2P -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        discord: {
                            bg: '#111214',
                            panel: '#1e1f22',
                            card: '#2b2d31',
                            hover: '#35373c',
                            blurple: '#5865F2',
                            blurpleHover: '#4752C4',
                            green: '#23a55a',
                            greenHover: '#1d8a4a',
                            red: '#da373c',
                            redHover: '#b82d31',
                            yellow: '#f0b232',
                            nitro: '#ff73fa',
                            text: '#f2f3f5',
                            muted: '#949ba4'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            background: #111214;
            height: 6px;
            border-radius: 999px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -5px;
            background-color: #5865F2;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            border: 2px solid #ffffff;
        }
        .nitro-gradient {
            background: linear-gradient(135deg, #5865F2 0%, #ff73fa 100%);
        }
    </style>
</head>
<body class="bg-discord-bg text-discord-text font-sans antialiased h-screen w-screen overflow-hidden flex flex-col select-none">

    <!-- =========================================================
         BARRA SUPERIOR COMPACTA (CONEXÃO RÁPIDA COM PARCEIRO/A)
         ========================================================= -->
    <header class="bg-discord-panel border-b border-white/10 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 shrink-0 z-20">
        <!-- Logo e Status -->
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl nitro-gradient flex items-center justify-center text-white shadow">
                <i class="fa-solid fa-desktop text-sm"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <span class="font-bold text-white text-sm tracking-tight">StreamCord</span>
                    <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-discord-blurple text-white">1080p 30FPS</span>
                </div>
                <div class="flex items-center gap-1.5 text-[11px] text-discord-muted">
                    <span id="peerStatusDot" class="w-2 h-2 rounded-full bg-discord-yellow animate-pulse"></span>
                    <span id="peerStatusText">Gerando seu código...</span>
                </div>
            </div>
        </div>

        <!-- Controles de Código da Sala (Super Simples) -->
        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
            <!-- Meu Código -->
            <div class="flex items-center bg-discord-bg border border-white/10 rounded-xl px-3 py-1.5 gap-2">
                <span class="text-xs text-discord-muted">Meu Código:</span>
                <span id="myShortCode" class="font-mono font-bold text-sm text-discord-nitro tracking-wider select-all">-----</span>
                <button onclick="copyMyCode()" id="copyBtn" class="bg-discord-card hover:bg-discord-hover text-xs text-white px-2.5 py-1 rounded-lg transition flex items-center gap-1.5" title="Copiar meu código">
                    <i class="fa-regular fa-copy"></i>
                    <span>Copiar</span>
                </button>
            </div>

            <!-- Conectar ao Parceiro(a) -->
            <div id="connectFormWrapper" class="flex items-center bg-discord-bg border border-white/10 rounded-xl p-1 gap-1.5">
                <input id="partnerCodeInput" type="text" maxlength="20" placeholder="Código dela(e)"
                    class="bg-transparent text-white font-mono text-xs uppercase px-2.5 py-1 w-28 sm:w-32 focus:outline-none placeholder:normal-case placeholder:font-sans placeholder:text-discord-muted">
                <button onclick="connectToPartner()" id="connectBtn"
                    class="bg-discord-blurple hover:bg-discord-blurpleHover text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                    <i class="fa-solid fa-link"></i>
                    <span>Conectar</span>
                </button>
            </div>

            <!-- Badge Conectado + Botão Sincronizar -->
            <div id="connectedBanner" class="hidden items-center bg-discord-green/15 border border-discord-green/40 rounded-xl px-3 py-1.5 gap-2.5">
                <span class="w-2 h-2 rounded-full bg-discord-green animate-ping"></span>
                <span id="connectedPartnerLabel" class="text-xs font-bold text-white">Conectado</span>
                <button onclick="manualSyncStreams()" title="Forçar reenvio de vídeo" class="text-xs bg-discord-card hover:bg-discord-hover text-white px-2 py-1 rounded-lg transition flex items-center gap-1">
                    <i class="fa-solid fa-rotate"></i>
                    <span class="hidden sm:inline">Sincronizar</span>
                </button>
                <button onclick="disconnectPartner()" title="Desconectar da sala" class="text-xs text-discord-red hover:text-white px-1.5 py-0.5 rounded transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- =========================================================
         PALCO DE VÍDEO PRINCIPAL (TELA LIMPA E AMPLA)
         ========================================================= -->
    <main class="flex-1 p-3 sm:p-4 flex flex-col overflow-hidden relative">
        <div id="videoStageContainer" class="relative flex-1 w-full h-full bg-[#090a0c] rounded-2xl border border-white/10 overflow-hidden flex items-center justify-center shadow-2xl">

            <!-- Barra Flutuante Superior Esquerda: Alternar entre Tela do Parceiro(a) e Minha Prévia -->
            <div class="absolute top-3.5 left-3.5 z-20 flex items-center gap-1.5 bg-discord-panel/90 backdrop-blur-md p-1 rounded-xl border border-white/10 shadow-lg">
                <button id="tabRemoteBtn" onclick="switchView('remote')"
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition bg-discord-blurple text-white">
                    <i class="fa-solid fa-tv"></i>
                    <span>Tela Conectada</span>
                    <span id="remoteLiveDot" class="hidden w-2 h-2 rounded-full bg-discord-green animate-ping"></span>
                </button>
                <button id="tabLocalBtn" onclick="switchView('local')"
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition text-discord-muted hover:text-white">
                    <i class="fa-solid fa-eye"></i>
                    <span>Minha Tela</span>
                    <span id="localLiveDot" class="hidden w-2 h-2 rounded-full bg-discord-red"></span>
                </button>
            </div>

            <!-- Badges Flutuantes Superiores Direitas (Resolução & Status de Áudio) -->
            <div id="streamInfoBadges" class="hidden absolute top-3.5 right-3.5 z-20 items-center gap-2 pointer-events-none">
                <span id="resFpsBadge" class="bg-black/80 backdrop-blur-md text-white font-mono text-xs font-bold px-2.5 py-1 rounded-lg border border-white/10">
                    1080p • 30 FPS
                </span>
                <span id="audioStateBadge" class="bg-black/80 backdrop-blur-md text-discord-green text-xs font-semibold px-2.5 py-1 rounded-lg border border-white/10">
                    Som Ativo
                </span>
            </div>

            <!-- Botão de Desbloqueio de Autoplay com Áudio (Caso o navegador bloqueie o som inicial) -->
            <button id="unmuteAutoplayBtn" onclick="forceUnmuteRemoteVideo()"
                class="hidden absolute top-16 left-1/2 -translate-x-1/2 z-30 bg-discord-blurple hover:bg-discord-blurpleHover text-white font-bold text-xs sm:text-sm px-5 py-2.5 rounded-full shadow-2xl border border-white/20 items-center gap-2 animate-bounce">
                <i class="fa-solid fa-volume-high"></i>
                <span>Clique aqui para ativar o som da transmissão</span>
            </button>

            <!-- VÍDEO 1: TELA DO PARCEIRO(A) -->
            <video id="remoteVideo" autoplay playsinline class="w-full h-full object-contain hidden"></video>

            <!-- VÍDEO 2: MINHA PRÉVIA LOCAL (Sempre mutado para você não se ouvir dobrado) -->
            <video id="localVideo" autoplay playsinline muted class="w-full h-full object-contain hidden"></video>

            <!-- ESTADO VAZIO (Instruções curtas e diretas) -->
            <div id="emptyStage" class="max-w-md text-center p-6 space-y-4">
                <div class="w-16 h-16 mx-auto rounded-2xl bg-discord-card border border-white/10 flex items-center justify-center text-discord-blurple text-2xl shadow-inner">
                    <i class="fa-solid fa-display"></i>
                </div>
                <div class="space-y-1.5">
                    <h2 id="emptyStageTitle" class="text-lg font-bold text-white">Nenhuma tela transmitindo agora</h2>
                    <p id="emptyStageDesc" class="text-xs text-discord-muted leading-relaxed">
                        1. Digite o código de 5 letras no topo e clique em <strong>Conectar</strong>.<br>
                        2. Clique em <strong>Compartilhar Tela</strong> abaixo para transmitir em <strong>1080p 30FPS</strong>.
                    </p>
                </div>
            </div>

        </div>
    </main>

    <!-- =========================================================
         BARRA INFERIOR DE CONTROLES (ESTILO CALL DO DISCORD)
         ========================================================= -->
    <footer class="bg-discord-panel border-t border-white/10 px-4 py-3 flex flex-wrap items-center justify-center gap-2.5 sm:gap-3 shrink-0 z-20">

        <!-- 1. Botão Compartilhar / Parar Tela -->
        <button id="shareScreenBtn" onclick="toggleScreenShare()"
            class="bg-discord-green hover:bg-discord-greenHover text-white font-bold text-xs sm:text-sm px-5 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2">
            <i id="shareScreenIcon" class="fa-solid fa-desktop"></i>
            <span id="shareScreenText">Compartilhar Tela (1080p)</span>
        </button>

        <!-- 2. Botão Mutar Som Enviado na Live (Evita Eco de Vozes do Discord) -->
        <button id="muteOutgoingAudioBtn" onclick="toggleOutgoingAudioMute()"
            class="bg-discord-card hover:bg-discord-hover text-white font-semibold text-xs px-4 py-2.5 rounded-xl border border-white/10 transition flex items-center gap-2"
            title="Corta 100% do som enviado na sua transmissão para não dar eco nas vozes do Discord">
            <i id="muteOutgoingIcon" class="fa-solid fa-ear-deaf text-discord-green"></i>
            <span id="muteOutgoingText">Mutar Som do Discord/Live: OFF</span>
        </button>

        <!-- 3. Botão Filtro Anti-Voz (300Hz-3400Hz) para quando quiser manter som do jogo e abafar vozes -->
        <button id="voiceFilterBtn" onclick="toggleVoiceBandFilter()"
            class="bg-discord-card hover:bg-discord-hover text-discord-muted hover:text-white font-semibold text-xs px-4 py-2.5 rounded-xl border border-white/10 transition flex items-center gap-2"
            title="Atenua frequências de voz humana (300Hz-3.4kHz) mantendo graves e agudos do jogo">
            <i class="fa-solid fa-wave-square"></i>
            <span id="voiceFilterText">Filtro Anti-Voz: OFF</span>
        </button>

        <div class="h-6 w-[1px] bg-white/10 hidden sm:block"></div>

        <!-- 4. Volume da Transmissão Recebida -->
        <div class="flex items-center gap-2 bg-discord-bg px-3 py-2 rounded-xl border border-white/10">
            <button onclick="toggleRemoteVolumeMute()" class="text-discord-muted hover:text-white transition" title="Mutar som que eu escuto">
                <i id="remoteVolIcon" class="fa-solid fa-volume-high text-xs"></i>
            </button>
            <input id="remoteVolSlider" type="range" min="0" max="100" value="100"
                oninput="changeRemoteVolume(this.value)" class="w-20" title="Volume da tela conectada">
        </div>

        <!-- 5. Botão Tela Cheia -->
        <button onclick="toggleFullscreen()" title="Tela Cheia"
            class="bg-discord-card hover:bg-discord-hover text-discord-muted hover:text-white px-3.5 py-2.5 rounded-xl border border-white/10 transition">
            <i class="fa-solid fa-expand text-xs"></i>
        </button>

    </footer>

    <!-- Container de Notificações Rápidas (Toasts) -->
    <div id="toastContainer" class="fixed bottom-20 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- =========================================================
         LÓGICA P2P BIDIRECIONAL + WEB AUDIO API
         ========================================================= -->
    <script>
        const PEER_PREFIX = 'sc1080p-';

        let peer = null;
        let myCode = '';
        let connectedPeerId = null;
        let dataConn = null;
        let outgoingCall = null;
        let incomingCall = null;

        // Streams
        let rawDisplayStream = null;
        let outboundStream = null;
        let remoteStream = null;

        // Estados de visualização e áudio
        let activeTab = 'remote'; // 'remote' ou 'local'
        let isSharing = false;
        let isOutgoingAudioMuted = false; // Quando TRUE, corta o som enviado na live para não vazar vozes do Discord
        let isVoiceFilterActive = false;  // Quando TRUE, ativa Biquad Notch na faixa de voz (300Hz-3.4kHz)

        // Web Audio API
        let audioCtx = null;
        let outGainNode = null;
        let filterBand1 = null;
        let filterBand2 = null;
        let filterBand3 = null;

        let statsTimer = null;

        window.onload = () => {
            initPeer();
        };

        // Gera código curto de 5 caracteres (ex: 7K9P2) fácil de digitar
        function generateShortCode() {
            const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
            let code = '';
            for (let i = 0; i < 5; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function cleanInputCode(raw) {
            if (!raw) return '';
            let cleaned = raw.trim().toUpperCase();
            if (cleaned.startsWith('SC1080P-')) {
                cleaned = cleaned.replace('SC1080P-', '');
            }
            return cleaned;
        }

        // =========================================================
        // 1. INICIALIZAÇÃO DO PEERJS E SERVIDORES STUN
        // =========================================================
        function initPeer() {
            myCode = generateShortCode();
            const fullPeerId = PEER_PREFIX + myCode;

            peer = new Peer(fullPeerId, {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun.cloudflare.com:3478' }
                    ]
                }
            });

            peer.on('open', () => {
                document.getElementById('myShortCode').textContent = myCode;
                setPeerStatus('Online • Pronto para conectar', 'green');
            });

            // Quando o parceiro(a) conecta via código
            peer.on('connection', (conn) => {
                setupDataChannel(conn);
            });

            // Quando o parceiro(a) envia a transmissão de vídeo dele(a)
            peer.on('call', (call) => {
                incomingCall = call;
                // Sempre salvamos o ID de quem ligou para garantir comunicação nos dois sentidos
                if (!connectedPeerId) {
                    connectedPeerId = call.peer;
                    updateConnectedUI(call.peer.replace(PEER_PREFIX, ''));
                }

                // Respondemos sem passar stream na resposta (cada direção usa sua própria chamada independente!)
                call.answer();

                call.on('stream', (incStream) => {
                    receiveRemoteStream(incStream);
                });

                call.on('close', () => {
                    clearRemoteStream();
                });

                call.on('error', () => {
                    clearRemoteStream();
                });
            });

            peer.on('error', (err) => {
                console.warn('PeerJS Error:', err.type);
                if (err.type === 'unavailable-id') {
                    initPeer();
                } else if (err.type === 'peer-unavailable') {
                    showToast('Código não encontrado! Verifique se sua namorada(o) está com a página aberta.', 'error');
                    resetConnectionBtn();
                }
            });
        }

        function setPeerStatus(text, color) {
            const dot = document.getElementById('peerStatusDot');
            const label = document.getElementById('peerStatusText');
            label.textContent = text;
            dot.className = 'w-2 h-2 rounded-full ' + (color === 'green' ? 'bg-discord-green' : 'bg-discord-yellow animate-pulse');
        }

        // =========================================================
        // 2. CONEXÃO BIDIRECIONAL ENTRE VOCÊ E SUA NAMORADA
        // =========================================================
        function connectToPartner() {
            const rawInput = document.getElementById('partnerCodeInput').value;
            const partnerCode = cleanInputCode(rawInput);

            if (!partnerCode) {
                showToast('Digite o código de 5 letras primeiro!', 'warning');
                return;
            }
            if (partnerCode === myCode) {
                showToast('Esse é o seu próprio código! Digite o código dela(e).', 'warning');
                return;
            }

            const targetPeerId = PEER_PREFIX + partnerCode;
            connectedPeerId = targetPeerId;

            const btn = document.getElementById('connectBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Conectando...</span>';

            const conn = peer.connect(targetPeerId, { reliable: true });
            setupDataChannel(conn);

            // Se já estivermos compartilhando tela antes mesmo do canal de dados abrir, já empuxamos o vídeo
            if (isSharing && outboundStream) {
                pushStreamToPartner();
            }
        }

        function setupDataChannel(conn) {
            dataConn = conn;
            connectedPeerId = conn.peer;

            conn.on('open', () => {
                const shortPartner = conn.peer.replace(PEER_PREFIX, '');
                updateConnectedUI(shortPartner);
                showToast(`Conectado com ${shortPartner}!`, 'success');

                // Se EU já estou compartilhando tela, envio imediatamente para o parceiro(a)
                if (isSharing && outboundStream) {
                    pushStreamToPartner();
                }

                // Pede para o parceiro(a) também enviar a tela dele(a) caso já esteja compartilhando
                conn.send({ type: 'SYNC_REQUEST' });
            });

            conn.on('data', (data) => {
                if (!data) return;

                if (data.type === 'SYNC_REQUEST') {
                    // O parceiro pediu sincronização: se estamos transmitindo, enviamos a chamada agora
                    if (isSharing && outboundStream) {
                        pushStreamToPartner();
                    }
                } else if (data.type === 'STREAM_STOPPED') {
                    clearRemoteStream();
                    showToast('O parceiro(a) encerrou o compartilhamento de tela.', 'info');
                }
            });

            conn.on('close', () => {
                disconnectPartner();
            });
        }

        function updateConnectedUI(partnerShortCode) {
            document.getElementById('connectFormWrapper').classList.add('hidden');
            const banner = document.getElementById('connectedBanner');
            banner.classList.remove('hidden');
            banner.classList.add('flex');
            document.getElementById('connectedPartnerLabel').textContent = `Conectado: ${partnerShortCode}`;
            resetConnectionBtn();
        }

        function resetConnectionBtn() {
            const btn = document.getElementById('connectBtn');
            btn.innerHTML = '<i class="fa-solid fa-link"></i><span>Conectar</span>';
        }

        function manualSyncStreams() {
            if (isSharing && outboundStream && connectedPeerId) {
                pushStreamToPartner();
            }
            if (dataConn && dataConn.open) {
                dataConn.send({ type: 'SYNC_REQUEST' });
            }
            showToast('Sincronizando transmissão de vídeo...', 'info');
        }

        function disconnectPartner() {
            if (outgoingCall) { outgoingCall.close(); outgoingCall = null; }
            if (incomingCall) { incomingCall.close(); incomingCall = null; }
            if (dataConn) { dataConn.close(); dataConn = null; }
            connectedPeerId = null;

            clearRemoteStream();
            document.getElementById('connectedBanner').classList.add('hidden');
            document.getElementById('connectedBanner').classList.remove('flex');
            document.getElementById('connectFormWrapper').classList.remove('hidden');
            showToast('Desconectado da sala.', 'info');
        }

        // Envia nosso stream 1080p para o parceiro(a) conectado
        function pushStreamToPartner() {
            if (!peer || !connectedPeerId || !outboundStream) return;

            try {
                if (outgoingCall) {
                    outgoingCall.close();
                }
                outgoingCall = peer.call(connectedPeerId, outboundStream);
                if (outgoingCall && outgoingCall.peerConnection) {
                    boostWebRTCBitrate(outgoingCall.peerConnection);
                }
            } catch (e) {
                console.error('Erro ao enviar stream para parceiro:', e);
            }
        }

        // Recebe e exibe imediatamente o vídeo do parceiro(a)
        function receiveRemoteStream(stream) {
            remoteStream = stream;
            const remoteVideo = document.getElementById('remoteVideo');
            remoteVideo.srcObject = stream;

            document.getElementById('remoteLiveDot').classList.remove('hidden');

            // Muda automaticamente para a aba "Tela Conectada" assim que o vídeo chega
            switchView('remote');
            playRemoteVideoSafely();
            startTelemetry();
            showToast('Recebendo transmissão ao vivo!', 'success');

            // Detecta se as tracks remotas encerrarem
            stream.getVideoTracks().forEach(track => {
                track.onended = () => clearRemoteStream();
            });
        }

        // Garante que o vídeo toque mesmo se o navegador bloquear Autoplay com som
        function playRemoteVideoSafely() {
            const remoteVideo = document.getElementById('remoteVideo');
            const unmuteBtn = document.getElementById('unmuteAutoplayBtn');

            remoteVideo.muted = false;
            const playPromise = remoteVideo.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    unmuteBtn.classList.add('hidden');
                    unmuteBtn.classList.remove('flex');
                }).catch(() => {
                    // Navegador bloqueou reprodução com áudio sem clique prévio -> toca mutado e exibe botão
                    remoteVideo.muted = true;
                    remoteVideo.play().catch(() => {});
                    unmuteBtn.classList.remove('hidden');
                    unmuteBtn.classList.add('flex');
                });
            }
        }

        function forceUnmuteRemoteVideo() {
            const remoteVideo = document.getElementById('remoteVideo');
            const unmuteBtn = document.getElementById('unmuteAutoplayBtn');
            remoteVideo.muted = false;
            remoteVideo.volume = document.getElementById('remoteVolSlider').value / 100;
            remoteVideo.play().catch(() => {});
            unmuteBtn.classList.add('hidden');
            unmuteBtn.classList.remove('flex');
        }

        function clearRemoteStream() {
            remoteStream = null;
            const remoteVideo = document.getElementById('remoteVideo');
            remoteVideo.srcObject = null;
            document.getElementById('remoteLiveDot').classList.add('hidden');
            document.getElementById('unmuteAutoplayBtn').classList.add('hidden');
            document.getElementById('unmuteAutoplayBtn').classList.remove('flex');

            if (isSharing) {
                switchView('local');
            } else {
                refreshStageVisibility();
            }
        }

        // =========================================================
        // 3. CAPTURA DE TELA 1080p 30FPS + ANTI-VOZ DO DISCORD
        // =========================================================
        function toggleScreenShare() {
            if (isSharing) {
                stopScreenShare();
            } else {
                startScreenShare();
            }
        }

        async function startScreenShare() {
            try {
                rawDisplayStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        width: { ideal: 1920, max: 1920 },
                        height: { ideal: 1080, max: 1080 },
                        frameRate: { ideal: 30, max: 30 },
                        cursor: 'always'
                    },
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                const videoTrack = rawDisplayStream.getVideoTracks()[0];
                if (videoTrack && 'contentHint' in videoTrack) {
                    videoTrack.contentHint = 'motion';
                }

                videoTrack.onended = () => {
                    stopScreenShare();
                };

                // Monta o stream de saída com segurança (funciona COM ou SEM áudio compartilhado)
                await setupOutboundStream(rawDisplayStream);

                isSharing = true;
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = outboundStream;
                localVideo.play().catch(() => {});

                document.getElementById('localLiveDot').classList.remove('hidden');
                updateShareButtonUI(true);

                // Se o parceiro não estiver transmitindo, mostra nossa prévia; se estiver, mantém na tela dele
                if (!remoteStream) {
                    switchView('local');
                } else {
                    refreshStageVisibility();
                }

                startTelemetry();

                // Se já estamos conectados com o parceiro(a), envia o vídeo imediatamente!
                if (connectedPeerId) {
                    pushStreamToPartner();
                    showToast('Transmitindo sua tela em 1080p 30FPS para o parceiro(a)!', 'success');
                } else {
                    showToast('Tela capturada! Conecte ao código do parceiro(a) no topo.', 'info');
                }

            } catch (err) {
                console.warn('Compartilhamento cancelado:', err);
            }
        }

        async function setupOutboundStream(sourceStream) {
            const audioTracks = sourceStream.getAudioTracks();

            // Se o usuário não marcou "Compartilhar áudio do sistema", envia o vídeo direto sem erro!
            if (audioTracks.length === 0) {
                outboundStream = new MediaStream([sourceStream.getVideoTracks()[0]]);
                updateAudioBadgeUI(false);
                return;
            }

            try {
                if (!audioCtx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioCtx();
                }
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const dest = audioCtx.createMediaStreamDestination();
                const src = audioCtx.createMediaStreamSource(new MediaStream([audioTracks[0]]));

                // 3 Filtros Biquad cirúrgicos na faixa de voz humana do Discord (300Hz a 3400Hz)
                filterBand1 = audioCtx.createBiquadFilter();
                filterBand1.type = 'peaking';
                filterBand1.frequency.value = 500;
                filterBand1.Q.value = 1.2;

                filterBand2 = audioCtx.createBiquadFilter();
                filterBand2.type = 'peaking';
                filterBand2.frequency.value = 1350;
                filterBand2.Q.value = 0.9;

                filterBand3 = audioCtx.createBiquadFilter();
                filterBand3.type = 'peaking';
                filterBand3.frequency.value = 2700;
                filterBand3.Q.value = 1.2;

                outGainNode = audioCtx.createGain();

                src.connect(filterBand1);
                filterBand1.connect(filterBand2);
                filterBand2.connect(filterBand3);
                filterBand3.connect(outGainNode);
                outGainNode.connect(dest);

                applyAudioFilterStates();

                outboundStream = new MediaStream([
                    sourceStream.getVideoTracks()[0],
                    ...dest.stream.getAudioTracks()
                ]);
                updateAudioBadgeUI(true);

            } catch (e) {
                console.warn('Fallback de áudio direto:', e);
                outboundStream = sourceStream;
                updateAudioBadgeUI(true);
            }
        }

        function applyAudioFilterStates() {
            // 1. Mute total da live (Anti-Eco para quem já está em Call no Discord)
            if (outGainNode && audioCtx) {
                outGainNode.gain.setTargetAtTime(isOutgoingAudioMuted ? 0 : 1, audioCtx.currentTime, 0.02);
            }
            if (outboundStream) {
                outboundStream.getAudioTracks().forEach(t => {
                    t.enabled = !isOutgoingAudioMuted;
                });
            }

            // 2. Filtro Notch de Vozes (300Hz - 3400Hz)
            if (filterBand1 && filterBand2 && filterBand3 && audioCtx) {
                const db = isVoiceFilterActive ? -34 : 0;
                const now = audioCtx.currentTime;
                filterBand1.gain.setTargetAtTime(db, now, 0.03);
                filterBand2.gain.setTargetAtTime(db * 1.15, now, 0.03);
                filterBand3.gain.setTargetAtTime(db, now, 0.03);
            }

            updateAudioBadgeUI(rawDisplayStream && rawDisplayStream.getAudioTracks().length > 0);
        }

        // Botão 2: Mutar Som da Live (Ideal quando estão conversando no Discord)
        function toggleOutgoingAudioMute() {
            isOutgoingAudioMuted = !isOutgoingAudioMuted;
            applyAudioFilterStates();

            const btn = document.getElementById('muteOutgoingAudioBtn');
            const icon = document.getElementById('muteOutgoingIcon');
            const text = document.getElementById('muteOutgoingText');

            if (isOutgoingAudioMuted) {
                btn.className = 'bg-discord-red/20 border border-discord-red text-white font-semibold text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-2';
                icon.className = 'fa-solid fa-volume-xmark text-discord-red';
                text.textContent = 'Mutar Som do Discord/Live: ON (Sem Eco)';
                showToast('Áudio da transmissão mutado! Vocês não ouvirão vozes duplicadas do Discord.', 'success');
            } else {
                btn.className = 'bg-discord-card hover:bg-discord-hover text-white font-semibold text-xs px-4 py-2.5 rounded-xl border border-white/10 transition flex items-center gap-2';
                icon.className = 'fa-solid fa-ear-deaf text-discord-green';
                text.textContent = 'Mutar Som do Discord/Live: OFF';
                showToast('Áudio da transmissão ativado.', 'info');
            }
        }

        // Botão 3: Filtro Anti-Voz (300Hz-3400Hz)
        function toggleVoiceBandFilter() {
            isVoiceFilterActive = !isVoiceFilterActive;
            applyAudioFilterStates();

            const btn = document.getElementById('voiceFilterBtn');
            const text = document.getElementById('voiceFilterText');

            if (isVoiceFilterActive) {
                btn.className = 'bg-discord-nitro/20 border border-discord-nitro text-white font-semibold text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-2';
                text.textContent = 'Filtro Anti-Voz: ON (300-3.4kHz)';
                showToast('Filtro Anti-Voz ativado: Frequências vocais reduzidas!', 'success');
            } else {
                btn.className = 'bg-discord-card hover:bg-discord-hover text-discord-muted hover:text-white font-semibold text-xs px-4 py-2.5 rounded-xl border border-white/10 transition flex items-center gap-2';
                text.textContent = 'Filtro Anti-Voz: OFF';
                showToast('Filtro Anti-Voz desativado.', 'info');
            }
        }

        function stopScreenShare() {
            isSharing = false;

            if (rawDisplayStream) {
                rawDisplayStream.getTracks().forEach(t => t.stop());
                rawDisplayStream = null;
            }
            if (outboundStream) {
                outboundStream.getTracks().forEach(t => t.stop());
                outboundStream = null;
            }
            if (outgoingCall) {
                outgoingCall.close();
                outgoingCall = null;
            }
            if (dataConn && dataConn.open) {
                dataConn.send({ type: 'STREAM_STOPPED' });
            }

            const localVideo = document.getElementById('localVideo');
            localVideo.srcObject = null;
            document.getElementById('localLiveDot').classList.add('hidden');

            updateShareButtonUI(false);

            if (remoteStream) {
                switchView('remote');
            } else {
                refreshStageVisibility();
            }
        }

        function updateShareButtonUI(sharing) {
            const btn = document.getElementById('shareScreenBtn');
            const icon = document.getElementById('shareScreenIcon');
            const text = document.getElementById('shareScreenText');

            if (sharing) {
                btn.className = 'bg-discord-red hover:bg-discord-redHover text-white font-bold text-xs sm:text-sm px-5 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2';
                icon.className = 'fa-solid fa-circle-stop';
                text.textContent = 'Parar Transmissão';
            } else {
                btn.className = 'bg-discord-green hover:bg-discord-greenHover text-white font-bold text-xs sm:text-sm px-5 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2';
                icon.className = 'fa-solid fa-desktop';
                text.textContent = 'Compartilhar Tela (1080p)';
            }
        }

        function updateAudioBadgeUI(hasAudioTrack) {
            const badge = document.getElementById('audioStateBadge');
            if (!hasAudioTrack) {
                badge.textContent = 'Vídeo (Sem Áudio)';
                badge.className = 'bg-black/80 backdrop-blur-md text-discord-muted text-xs font-semibold px-2.5 py-1 rounded-lg border border-white/10';
            } else if (isOutgoingAudioMuted) {
                badge.textContent = 'Som da Live Mutado';
                badge.className = 'bg-black/80 backdrop-blur-md text-discord-red text-xs font-semibold px-2.5 py-1 rounded-lg border border-discord-red/30';
            } else if (isVoiceFilterActive) {
                badge.textContent = 'Anti-Voz Ativo';
                badge.className = 'bg-black/80 backdrop-blur-md text-discord-nitro text-xs font-semibold px-2.5 py-1 rounded-lg border border-discord-nitro/30';
            } else {
                badge.textContent = 'Som Ativo';
                badge.className = 'bg-black/80 backdrop-blur-md text-discord-green text-xs font-semibold px-2.5 py-1 rounded-lg border border-white/10';
            }
        }

        // Aumenta o Bitrate WebRTC para 6 Mbps (Full HD 1080p 30FPS cristalino)
        function boostWebRTCBitrate(pc) {
            if (!pc || !pc.getSenders) return;
            setTimeout(() => {
                pc.getSenders().forEach(sender => {
                    if (sender.track && sender.track.kind === 'video') {
                        const params = sender.getParameters();
                        if (!params.encodings) params.encodings = [{}];
                        params.encodings[0].maxBitrate = 6000000;
                        params.encodings[0].maxFramerate = 30;
                        sender.setParameters(params).catch(() => {});
                    }
                });
            }, 800);
        }

        // =========================================================
        // 4. CONTROLE DO PALCO DE VÍDEO E INTERFACE
        // =========================================================
        function switchView(tab) {
            activeTab = tab;
            const tabRemoteBtn = document.getElementById('tabRemoteBtn');
            const tabLocalBtn = document.getElementById('tabLocalBtn');

            if (tab === 'remote') {
                tabRemoteBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition bg-discord-blurple text-white';
                tabLocalBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition text-discord-muted hover:text-white';
            } else {
                tabLocalBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition bg-discord-blurple text-white';
                tabRemoteBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition text-discord-muted hover:text-white';
            }

            refreshStageVisibility();
        }

        function refreshStageVisibility() {
            const remoteVideo = document.getElementById('remoteVideo');
            const localVideo = document.getElementById('localVideo');
            const emptyStage = document.getElementById('emptyStage');
            const badges = document.getElementById('streamInfoBadges');

            if (activeTab === 'remote') {
                localVideo.classList.add('hidden');
                if (remoteStream) {
                    remoteVideo.classList.remove('hidden');
                    emptyStage.classList.add('hidden');
                    badges.classList.remove('hidden');
                    badges.classList.add('flex');
                } else {
                    remoteVideo.classList.add('hidden');
                    emptyStage.classList.remove('hidden');
                    badges.classList.add('hidden');
                    badges.classList.remove('flex');
                    document.getElementById('emptyStageTitle').textContent = connectedPeerId
                        ? 'Aguardando seu parceiro(a) clicar em "Compartilhar Tela"...'
                        : 'Nenhuma tela conectada ainda';
                }
            } else {
                remoteVideo.classList.add('hidden');
                if (isSharing && outboundStream) {
                    localVideo.classList.remove('hidden');
                    emptyStage.classList.add('hidden');
                    badges.classList.remove('hidden');
                    badges.classList.add('flex');
                } else {
                    localVideo.classList.add('hidden');
                    emptyStage.classList.remove('hidden');
                    badges.classList.add('hidden');
                    badges.classList.remove('flex');
                    document.getElementById('emptyStageTitle').textContent = 'Você ainda não está compartilhando sua tela';
                }
            }
        }

        function startTelemetry() {
            if (statsTimer) clearInterval(statsTimer);
            statsTimer = setInterval(() => {
                const videoEl = activeTab === 'remote' ? document.getElementById('remoteVideo') : document.getElementById('localVideo');
                if (videoEl && videoEl.videoWidth > 0) {
                    document.getElementById('resFpsBadge').textContent = `${videoEl.videoWidth}x${videoEl.videoHeight} • 30 FPS`;
                }
            }, 1000);
        }

        function changeRemoteVolume(val) {
            const remoteVideo = document.getElementById('remoteVideo');
            remoteVideo.volume = val / 100;
            remoteVideo.muted = (Number(val) === 0);
            document.getElementById('remoteVolIcon').className = Number(val) === 0
                ? 'fa-solid fa-volume-xmark text-discord-red text-xs'
                : 'fa-solid fa-volume-high text-xs';
        }

        function toggleRemoteVolumeMute() {
            const remoteVideo = document.getElementById('remoteVideo');
            remoteVideo.muted = !remoteVideo.muted;
            document.getElementById('remoteVolIcon').className = remoteVideo.muted
                ? 'fa-solid fa-volume-xmark text-discord-red text-xs'
                : 'fa-solid fa-volume-high text-xs';
        }

        function toggleFullscreen() {
            const stage = document.getElementById('videoStageContainer');
            if (!document.fullscreenElement) {
                stage.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function copyMyCode() {
            if (!myCode) return;
            const temp = document.createElement('input');
            temp.value = myCode;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            temp.remove();

            const btn = document.getElementById('copyBtn');
            btn.innerHTML = '<i class="fa-solid fa-check text-discord-green"></i><span>Copiado!</span>';
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-regular fa-copy"></i><span>Copiar</span>';
            }, 2000);
            showToast(`Código ${myCode} copiado! Envie para sua namorada(o).`, 'success');
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colors = {
                success: 'border-discord-green text-discord-green',
                warning: 'border-discord-yellow text-discord-yellow',
                error: 'border-discord-red text-discord-red',
                info: 'border-discord-blurple text-discord-blurple'
            };
            toast.className = `bg-discord-card border-l-4 ${colors[type]} text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium pointer-events-auto transition-opacity duration-300`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
